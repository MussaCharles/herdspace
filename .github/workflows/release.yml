# Runs each option of the Quick start of README.md with the command of the
# README, from a published release, as a person would, and tries each hopen
# feature. tests/run-release-check.sh does the work. docs/ci.md explains it.
name: Release check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check, for example 0.5.0. Empty means the latest release."
        required: false

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.option }} (${{ matrix.runner }})
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        option: [server, client, both, hopen]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the Quick start option of the README in fresh containers
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OPTION: ${{ matrix.option }}
        run: tests/run-release-check.sh --only linux ${TAG:+--version "$TAG"} "$OPTION"
      - name: Show the logs
        if: failure()
        run: tail -n 80 tests/.work/release-check-*.log

  macos:
    name: macOS ${{ matrix.option }}
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        option: [server, both, hopen]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner is a throwaway Mac, so the option runs on it, with no VM.
      - name: Run the Quick start option of the README on the runner
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OPTION: ${{ matrix.option }}
        run: tests/run-release-check.sh ${TAG:+--version "$TAG"} --here "$OPTION"
      - name: Show the logs
        if: failure()
        run: tail -n 80 tests/.work/release-check-*.log
