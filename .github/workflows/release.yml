# Runs each option of the Quick start of README.md with the command of the
# README, from a published release, as a person would, and tries each hopen
# feature. tests/run-release-check.sh does the work. docs/ci.md explains it.
name: Release check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to check, for example 0.5.0. Empty means the latest release."
        required: false

permissions:
  contents: read

jobs:
  verify:
    # Builds the release again from its tag, compares each published file with
    # the build, and signs the files with an attestation when they match.
    # It runs for a pre-release too.
    name: Release files match the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Find the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName)"
          echo "tag=${TAG}" >>"$GITHUB_OUTPUT"
      # The check comes from main. The tag is built in its own folder, so that
      # a changed tag cannot change the check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          path: tag-build
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the release files with a build of the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: tag-build
        run: ../tools/verify-release.sh "$TAG" --repo "${{ github.repository }}"
      - name: Sign the release files with an attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tag-build/dist/${{ steps.tag.outputs.tag }}-published/*

  linux:
    name: Linux ${{ matrix.option }} (${{ matrix.runner }})
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        option: [server, client, both, hopen]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Right after a publish, the download addresses and the releases/latest
      # link can answer with an error for a short time.
      - name: Wait until the release files download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          latest=""
          [ "$EVENT" != release ] || latest=--latest
          tools/wait-release-files.sh "$TAG" "$GITHUB_REPOSITORY" $latest
      - name: Run the Quick start option of the README in fresh containers
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OPTION: ${{ matrix.option }}
        run: tests/run-release-check.sh --only linux ${TAG:+--version "$TAG"} "$OPTION"
      - name: Show the logs
        if: failure()
        run: tail -n 80 tests/.work/release-check-*.log

  macos:
    name: macOS ${{ matrix.option }}
    if: ${{ !github.event.release.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        option: [server, both, hopen]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Right after a publish, the download addresses and the releases/latest
      # link can answer with an error for a short time.
      - name: Wait until the release files download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          [ -n "$TAG" ] || TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          latest=""
          [ "$EVENT" != release ] || latest=--latest
          tools/wait-release-files.sh "$TAG" "$GITHUB_REPOSITORY" $latest
      # The runner is a throwaway Mac, so the option runs on it, with no VM.
      - name: Run the Quick start option of the README on the runner
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OPTION: ${{ matrix.option }}
        run: tests/run-release-check.sh ${TAG:+--version "$TAG"} --here "$OPTION"
      - name: Show the logs
        if: failure()
        run: tail -n 80 tests/.work/release-check-*.log
