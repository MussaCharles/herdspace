name: Feature request
description: Suggest a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do, and what stops you now?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How can herdspace help? Commands or examples are welcome.
    validations:
      required: true
