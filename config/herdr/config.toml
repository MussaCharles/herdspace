# Herdr configuration from herdspace.
# After a change, run: herdr server reload-config
onboarding = false

[theme]
name = "dracula"
auto_switch = false

[theme.custom]
red = "#4e82ef"     # blocked, needs input
teal = "#4e82ef"    # done, not seen yet
yellow = "#a78bfa"  # working
active_row_bg = "#45475a"

[update]
# No background contact with herdr.dev. See bin/herdr-update-check.
version_check = false
manifest_check = false

[ui]
status_indicators = "dots"
agent_panel_sort = "priority"
prompt_new_tab_name = false
copy_on_select = false

[ui.toast]
delivery = "herdr"

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["tab"],
]

[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace"],
  ["branch"],
]

[ui.sound]
enabled = false

# The prefix is ctrl+space: one hand presses both keys, and the shell and
# Neovim do not use it. To change it, run: herdspace prefix KEY. The setup keeps
# that choice in ~/.config/herdspace/prefix and writes it on the line below.
# The client bootstrap scripts release the other keys in Ghostty. A Mac uses
# the Cmd keys. Linux uses the ctrl+shift keys.
[keys]
prefix = "ctrl+space"
new_tab = ["prefix+c", "cmd+t", "ctrl+shift+t"]
close_tab = ["prefix+shift+x", "cmd+w", "ctrl+shift+w"]
goto = ["prefix+g", "cmd+k", "ctrl+shift+k"]
previous_tab = ["prefix+p", "ctrl+left"]
next_tab = ["prefix+n", "ctrl+right"]
previous_workspace = "ctrl+up"
next_workspace = "ctrl+down"
cycle_pane_next = ["prefix+tab", "alt+up"]
cycle_pane_previous = ["prefix+shift+tab", "alt+down"]

# The hopen command palette, like Ctrl+Shift+P in VS Code. Esc closes it.
[[keys.command]]
key = ["cmd+shift+p", "ctrl+shift+p", "prefix+a"]
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec \"$HOME/.local/bin/hopen\" --palette"
description = "Command palette"
width = "80%"
height = "70%"

# Quick open, like Cmd+P in VS Code: choose a file of the project, and it opens
# in the Neovim pane of the tab, or in a new split on the right, with the focus
# on it. Linux keeps Ctrl+P for the shell and Neovim, so use the prefix, then F.
[[keys.command]]
key = ["cmd+p", "prefix+f"]
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec \"$HOME/.local/bin/hopen\" --quick-open"
description = "Quick open a file"
width = "80%"
height = "70%"

# Lazygit over the focused pane. q closes it.
[[keys.command]]
key = ["cmd+shift+g", "ctrl+shift+g", "prefix+d"]
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-.}\" && exec lazygit"
description = "Git status"
width = "90%"
height = "85%"
